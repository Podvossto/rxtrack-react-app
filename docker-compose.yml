# Local demo setup. Credentials below are for local use only.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: rxtrack
      MYSQL_USER: rxtrack
      MYSQL_PASSWORD: rxtrack
    volumes:
      - ./server/db:/docker-entrypoint-initdb.d:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./server
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: rxtrack
      DB_PASSWORD: rxtrack
      DB_NAME: rxtrack
      CORS_ORIGIN: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  dbdata:
